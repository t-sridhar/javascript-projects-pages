<!DOCTYPE html>
<html lang="en" data-page="wishlist">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripPlanner — My Wishlist</title>
  <link rel="icon" type="image/svg+xml" href="/javascript-projects-pages/05-tripplanner/assets/favicon-C1DAa1lr.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/javascript-projects-pages/05-tripplanner/assets/main-19eWkHKf.js"></script>
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/05-tripplanner/assets/main-LLULv25d.css">
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/05-tripplanner/assets/wishlist-DwTdWZIi.css">
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/05-tripplanner/assets/country-card-BE1IfAub.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="./index.html" class="header__logo">
        <svg class="header__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
          <ellipse cx="16" cy="16" rx="6" ry="14" stroke="currentColor" stroke-width="1.5"/>
          <line x1="2" y1="16" x2="30" y2="16" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="header__logo-text">TripPlanner</span>
      </a>
      <nav class="header__nav">
        <a href="./index.html" class="header__nav-link">Explore</a>
        <a href="./wishlist.html" class="header__nav-link header__nav-link--active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          Wishlist
          <span class="header__wishlist-badge" id="wishlist-badge" hidden>0</span>
        </a>
        <a href="./compare.html" class="header__nav-link">Compare</a>
        <a href="./planner.html" class="header__nav-link">Plan a Trip</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container wishlist-page">
      <div class="wishlist-page__header">
        <div>
          <h1 class="wishlist-page__title">My Wishlist</h1>
          <p class="wishlist-page__count" id="wishlist-count">Loading...</p>
        </div>
        <a href="./planner.html" class="btn btn--accent btn--md">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Plan a Trip
        </a>
      </div>

      <!-- Wishlist Grid -->
      <div class="wishlist__grid" id="wishlist-grid">
        <!-- Populated by JS -->
      </div>

      <!-- Loading State -->
      <div class="wishlist__loading" id="wishlist-loading" hidden>
        <div class="spinner"></div>
        <p>Loading your wishlist...</p>
      </div>

      <!-- Empty State -->
      <div class="wishlist__empty" id="wishlist-empty" hidden>
        <svg class="wishlist__empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <h3 class="wishlist__empty-title">Your wishlist is empty</h3>
        <p class="wishlist__empty-text">Start exploring countries and add your favorites to the wishlist.</p>
        <a href="./index.html" class="btn btn--primary btn--md">Explore Countries</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__text">&copy; 2026 TripPlanner. Built for learning JavaScript.</p>
    </div>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

</body>
</html>
