<!DOCTYPE html>
<html lang="en" data-page="cart">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodDash — Your Cart</title>
  <link rel="icon" type="image/svg+xml" href="/javascript-projects-pages/04-fooddash/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/javascript-projects-pages/04-fooddash/assets/main-D87nTE1A.js"></script>
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/04-fooddash/assets/main-BU865ec5.css">
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/04-fooddash/assets/cart-C80wEGVw.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="./index.html" class="header__logo">
        <svg class="header__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
          <path d="M10 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 8v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 10l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="header__logo-text">FoodDash</span>
      </a>
      <nav class="header__nav">
        <a href="./index.html" class="header__nav-link">Home</a>
        <a href="./menu.html" class="header__nav-link">Menu</a>
        <a href="./builder.html" class="header__nav-link">Builder</a>
        <a href="./cart.html" class="header__nav-link header__nav-link--active header__nav-link--cart">
          <svg class="header__cart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="21" r="1" stroke="currentColor" stroke-width="2"/>
            <circle cx="20" cy="21" r="1" stroke="currentColor" stroke-width="2"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Cart</span>
          <span class="header__cart-badge" id="cart-badge" hidden>0</span>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="page-title">Your Cart</h1>

      <!-- Empty Cart State -->
      <div class="empty-state" id="cart-empty" hidden>
        <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        <h3 class="empty-state__title">Your cart is empty</h3>
        <p class="empty-state__text">Looks like you haven't added any meals yet. Browse our menu to find something delicious!</p>
        <a href="./menu.html" class="btn btn--primary btn--lg">Browse Menu</a>
      </div>

      <!-- Cart Content -->
      <div class="cart-content" id="cart-content" hidden>
        <!-- Cart Items List -->
        <div class="cart-items" id="cart-items">
          <!-- Populated by JS -->
        </div>

        <!-- Order Summary -->
        <aside class="cart-summary">
          <h2 class="cart-summary__title">Order Summary</h2>
          <div class="cart-summary__row">
            <span>Subtotal</span>
            <span id="cart-subtotal">$0.00</span>
          </div>
          <div class="cart-summary__row">
            <span>Tax (8%)</span>
            <span id="cart-tax">$0.00</span>
          </div>
          <div class="cart-summary__row cart-summary__row--total">
            <span>Total</span>
            <span id="cart-total">$0.00</span>
          </div>
          <button class="btn btn--primary btn--lg cart-summary__checkout-btn" id="checkout-btn">
            Proceed to Checkout
          </button>
          <p class="cart-summary__count" id="cart-item-count">0 items</p>
        </aside>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__text">&copy; 2026 FoodDash. Built for learning JavaScript.</p>
    </div>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

</body>
</html>
