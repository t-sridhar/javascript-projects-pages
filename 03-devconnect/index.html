<!DOCTYPE html>
<html lang="en" data-page="feed">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevConnect — Developer Social Platform</title>
  <link rel="icon" type="image/svg+xml" href="/javascript-projects-pages/03-devconnect/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/javascript-projects-pages/03-devconnect/assets/main-DtFwY2Yb.js"></script>
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/03-devconnect/assets/main-Dpmr84OT.css">
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/03-devconnect/assets/main-DsNO2BaQ.css">
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/03-devconnect/assets/post-card-Diyl59Rk.css">
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/03-devconnect/assets/user-card-DzLxg_yf.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header__container">
      <a href="./index.html" class="header__logo">
        <svg class="header__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="#7c3aed"/>
          <text x="16" y="22" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="14" fill="white">&lt;/&gt;</text>
        </svg>
        <span class="header__logo-text">DevConnect</span>
      </a>
      <nav class="header__nav">
        <a href="./index.html" class="header__nav-link header__nav-link--active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Feed
        </a>
        <a href="./explore.html" class="header__nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Explore
        </a>
        <a href="./create.html" class="header__nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create Post
        </a>
      </nav>
      <button class="header__mobile-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Hero -->
  <section class="feed-hero">
    <div class="feed-hero__container">
      <h1 class="feed-hero__title">Connect with <span class="feed-hero__highlight">Developers</span></h1>
      <p class="feed-hero__subtitle">Share ideas, discover projects, and grow together</p>
      <div class="feed-hero__search">
        <svg class="feed-hero__search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="hero-search" class="feed-hero__search-input" placeholder="Search posts by title or content..." />
      </div>
    </div>
  </section>

  <!-- Main Content -->
  <main class="feed-main">
    <div class="feed-main__container">
      <!-- Left Sidebar -->
      <aside class="feed-sidebar feed-sidebar--left">
        <div class="feed-sidebar__section">
          <h3 class="feed-sidebar__title">Trending Topics</h3>
          <div id="sidebar-tags" class="trending-tags trending-tags--vertical"></div>
        </div>
        <div class="feed-sidebar__section">
          <h3 class="feed-sidebar__title">Stats</h3>
          <div id="feed-stats" class="feed-stats"></div>
        </div>
      </aside>

      <!-- Center Feed -->
      <section class="feed-center">
        <div class="feed-center__controls">
          <div class="feed-center__sort">
            <label for="sort-select" class="feed-center__sort-label">Sort by:</label>
            <select id="sort-select" class="feed-center__sort-select">
              <option value="latest">Latest</option>
              <option value="commented">Most Commented</option>
              <option value="alphabetical">Alphabetical</option>
            </select>
          </div>
          <div id="active-filter" class="feed-center__active-filter" style="display:none;">
            <span id="active-filter-text"></span>
            <button id="clear-filter" class="feed-center__clear-filter">&times;</button>
          </div>
        </div>
        <div id="posts-container" class="feed-center__posts"></div>
        <div id="scroll-sentinel" class="feed-center__sentinel">
          <div class="spinner"></div>
          <span>Loading more posts...</span>
        </div>
        <div id="empty-state" class="feed-center__empty" style="display:none;">
          <img src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20400%20300'%20fill='none'%3e%3crect%20width='400'%20height='300'%20fill='%23f5f3ff'%20rx='16'/%3e%3ccircle%20cx='200'%20cy='120'%20r='60'%20fill='%23ede9fe'%20stroke='%23a78bfa'%20stroke-width='2'/%3e%3cpath%20d='M180%20110%20L195%20125%20L220%20100'%20stroke='%237c3aed'%20stroke-width='4'%20stroke-linecap='round'%20stroke-linejoin='round'%20fill='none'/%3e%3crect%20x='140'%20y='200'%20width='120'%20height='12'%20rx='6'%20fill='%23e2e8f0'/%3e%3crect%20x='160'%20y='224'%20width='80'%20height='8'%20rx='4'%20fill='%23e2e8f0'/%3e%3crect%20x='150'%20y='248'%20width='100'%20height='8'%20rx='4'%20fill='%23e2e8f0'/%3e%3c/svg%3e" alt="No results" class="feed-center__empty-img" />
          <h3>No posts found</h3>
          <p>Try adjusting your search or filters</p>
        </div>
      </section>

      <!-- Right Sidebar -->
      <aside class="feed-sidebar feed-sidebar--right">
        <div class="feed-sidebar__section">
          <h3 class="feed-sidebar__title">Suggested Developers</h3>
          <div id="suggested-users" class="suggested-users"></div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__container">
      <p class="footer__text">&copy; 2026 DevConnect. Built for learning JavaScript.</p>
    </div>
  </footer>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

</body>
</html>
