<!DOCTYPE html>
<html lang="en" data-page="checkout">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodDash — Checkout</title>
  <link rel="icon" type="image/svg+xml" href="/javascript-projects-pages/04-fooddash/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/javascript-projects-pages/04-fooddash/assets/main-lOBdVFDI.js"></script>
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/04-fooddash/assets/main-DnW0Jx40.css">
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/04-fooddash/assets/checkout-DhhDA40o.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="./index.html" class="header__logo">
        <svg class="header__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
          <path d="M10 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 8v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 10l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="header__logo-text">FoodDash</span>
      </a>
      <nav class="header__nav">
        <a href="./index.html" class="header__nav-link">Home</a>
        <a href="./menu.html" class="header__nav-link">Menu</a>
        <a href="./builder.html" class="header__nav-link">Builder</a>
        <a href="./cart.html" class="header__nav-link header__nav-link--cart">
          <svg class="header__cart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="21" r="1" stroke="currentColor" stroke-width="2"/>
            <circle cx="20" cy="21" r="1" stroke="currentColor" stroke-width="2"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Cart</span>
          <span class="header__cart-badge" id="cart-badge" hidden>0</span>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <a href="./cart.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
        </svg>
        Back to Cart
      </a>
      <h1 class="page-title">Checkout</h1>

      <div class="checkout" id="checkout-content">
        <!-- Checkout Form -->
        <form class="checkout__form" id="checkout-form" novalidate>

          <!-- Contact Information -->
          <div class="checkout__section">
            <h2 class="checkout__section-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              Contact Information
            </h2>
            <div class="checkout__field">
              <label class="checkout__label" for="checkout-name">Full Name</label>
              <input type="text" id="checkout-name" class="checkout__input" placeholder="John Doe" required />
              <span class="checkout__error" id="error-name"></span>
            </div>
            <div class="checkout__row">
              <div class="checkout__field">
                <label class="checkout__label" for="checkout-email">Email</label>
                <input type="email" id="checkout-email" class="checkout__input" placeholder="john@example.com" required />
                <span class="checkout__error" id="error-email"></span>
              </div>
              <div class="checkout__field">
                <label class="checkout__label" for="checkout-phone">Phone</label>
                <input type="tel" id="checkout-phone" class="checkout__input" placeholder="(555) 123-4567" required />
                <span class="checkout__error" id="error-phone"></span>
              </div>
            </div>
          </div>

          <!-- Delivery Address -->
          <div class="checkout__section">
            <h2 class="checkout__section-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                <circle cx="12" cy="10" r="3"/>
              </svg>
              Delivery Address
            </h2>
            <div class="checkout__field">
              <label class="checkout__label" for="checkout-address">Street Address</label>
              <input type="text" id="checkout-address" class="checkout__input" placeholder="123 Main Street" required />
              <span class="checkout__error" id="error-address"></span>
            </div>
            <div class="checkout__field">
              <label class="checkout__label" for="checkout-apt">Apartment / Suite (Optional)</label>
              <input type="text" id="checkout-apt" class="checkout__input" placeholder="Apt 4B" />
            </div>
            <div class="checkout__row">
              <div class="checkout__field">
                <label class="checkout__label" for="checkout-city">City</label>
                <input type="text" id="checkout-city" class="checkout__input" placeholder="New York" required />
                <span class="checkout__error" id="error-city"></span>
              </div>
              <div class="checkout__field">
                <label class="checkout__label" for="checkout-zip">Zip Code</label>
                <input type="text" id="checkout-zip" class="checkout__input" placeholder="10001" required />
                <span class="checkout__error" id="error-zip"></span>
              </div>
            </div>
          </div>

          <!-- Payment Method -->
          <div class="checkout__section">
            <h2 class="checkout__section-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                <line x1="1" y1="10" x2="23" y2="10"/>
              </svg>
              Payment Method
            </h2>
            <div class="checkout__radio-group">
              <label class="checkout__radio">
                <input type="radio" name="payment" value="cash" checked />
                <span class="checkout__radio-custom"></span>
                <span class="checkout__radio-label">
                  <span class="checkout__radio-title">Cash on Delivery</span>
                  <span class="checkout__radio-desc">Pay when your order arrives</span>
                </span>
              </label>
              <label class="checkout__radio">
                <input type="radio" name="payment" value="card" />
                <span class="checkout__radio-custom"></span>
                <span class="checkout__radio-label">
                  <span class="checkout__radio-title">Credit / Debit Card</span>
                  <span class="checkout__radio-desc">Secure online payment</span>
                </span>
              </label>
            </div>

            <!-- Card Fields (shown when card selected) -->
            <div class="checkout__card-fields" id="card-fields" hidden>
              <div class="checkout__field">
                <label class="checkout__label" for="checkout-card-number">Card Number</label>
                <input type="text" id="checkout-card-number" class="checkout__input" placeholder="1234 5678 9012 3456" maxlength="19" />
                <span class="checkout__error" id="error-card-number"></span>
              </div>
              <div class="checkout__row">
                <div class="checkout__field">
                  <label class="checkout__label" for="checkout-card-expiry">Expiry</label>
                  <input type="text" id="checkout-card-expiry" class="checkout__input" placeholder="MM / YY" maxlength="7" />
                  <span class="checkout__error" id="error-card-expiry"></span>
                </div>
                <div class="checkout__field">
                  <label class="checkout__label" for="checkout-card-cvv">CVV</label>
                  <input type="text" id="checkout-card-cvv" class="checkout__input" placeholder="123" maxlength="4" />
                  <span class="checkout__error" id="error-card-cvv"></span>
                </div>
              </div>
            </div>
          </div>

          <!-- Order Notes -->
          <div class="checkout__section">
            <h2 class="checkout__section-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Order Notes
            </h2>
            <div class="checkout__field">
              <textarea id="checkout-notes" class="checkout__textarea" placeholder="Any special instructions for delivery..." rows="3"></textarea>
            </div>
          </div>

          <button type="submit" class="btn btn--primary btn--lg checkout__submit-btn" id="place-order-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 11-5.93-9.14" stroke-linecap="round"/>
              <path d="M22 4L12 14.01l-3-3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Place Order
          </button>
        </form>

        <!-- Order Summary Sidebar -->
        <aside class="checkout__summary">
          <h2 class="checkout__summary-title">Order Summary</h2>
          <div class="checkout__summary-items" id="checkout-items">
            <!-- Populated by JS -->
          </div>
          <div class="checkout__summary-row">
            <span>Subtotal</span>
            <span id="checkout-subtotal">$0.00</span>
          </div>
          <div class="checkout__summary-row">
            <span>Tax (8%)</span>
            <span id="checkout-tax">$0.00</span>
          </div>
          <div class="checkout__summary-row checkout__summary-row--total">
            <span>Total</span>
            <span id="checkout-total">$0.00</span>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__text">&copy; 2026 FoodDash. Built for learning JavaScript.</p>
    </div>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

</body>
</html>
