<!DOCTYPE html>
<html lang="en" data-page="meal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodDash — Meal Details</title>
  <link rel="icon" type="image/svg+xml" href="/javascript-projects-pages/04-fooddash/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/javascript-projects-pages/04-fooddash/assets/main-D87nTE1A.js"></script>
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/04-fooddash/assets/main-BU865ec5.css">
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/04-fooddash/assets/meal-DMcbhhML.css">
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/04-fooddash/assets/meal-card-CmfV7Kmb.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="./index.html" class="header__logo">
        <svg class="header__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
          <path d="M10 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 8v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M12 10l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="header__logo-text">FoodDash</span>
      </a>
      <nav class="header__nav">
        <a href="./index.html" class="header__nav-link">Home</a>
        <a href="./menu.html" class="header__nav-link">Menu</a>
        <a href="./builder.html" class="header__nav-link">Builder</a>
        <a href="./cart.html" class="header__nav-link header__nav-link--cart">
          <svg class="header__cart-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="21" r="1" stroke="currentColor" stroke-width="2"/>
            <circle cx="20" cy="21" r="1" stroke="currentColor" stroke-width="2"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Cart</span>
          <span class="header__cart-badge" id="cart-badge" hidden>0</span>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- Back Link -->
      <a href="./menu.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to Menu
      </a>

      <!-- Loading State -->
      <div class="loading-state" id="meal-loading" hidden>
        <div class="spinner"></div>
        <p>Loading meal details...</p>
      </div>

      <!-- Error State -->
      <div class="empty-state" id="meal-error" hidden>
        <svg class="empty-state__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <h3 class="empty-state__title">Meal not found</h3>
        <p class="empty-state__text">The meal you're looking for doesn't exist or has been removed.</p>
        <a href="./menu.html" class="btn btn--primary btn--md">Browse Menu</a>
      </div>

      <!-- Meal Detail (populated by JS) -->
      <div id="meal-detail" hidden></div>
    </div>

    <!-- Related Meals -->
    <section class="related-meals" id="related-section" hidden>
      <div class="container">
        <h2 class="section-title">You Might Also Like</h2>
        <p class="section-subtitle">More meals from the same category</p>
        <div class="related-grid" id="related-grid">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__text">&copy; 2026 FoodDash. Built for learning JavaScript.</p>
    </div>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

</body>
</html>
