<!DOCTYPE html>
<html lang="en" data-page="country">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripPlanner — Country Details</title>
  <link rel="icon" type="image/svg+xml" href="/javascript-projects-pages/05-tripplanner/assets/favicon-C1DAa1lr.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/javascript-projects-pages/05-tripplanner/assets/main-QmAThANY.js"></script>
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/05-tripplanner/assets/main-LLULv25d.css">
  <link rel="stylesheet" crossorigin href="/javascript-projects-pages/05-tripplanner/assets/country-C7vZxPvz.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="./index.html" class="header__logo">
        <svg class="header__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="2"/>
          <ellipse cx="16" cy="16" rx="6" ry="14" stroke="currentColor" stroke-width="1.5"/>
          <line x1="2" y1="16" x2="30" y2="16" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="header__logo-text">TripPlanner</span>
      </a>
      <nav class="header__nav">
        <a href="./index.html" class="header__nav-link">Explore</a>
        <a href="./wishlist.html" class="header__nav-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          Wishlist
          <span class="header__wishlist-badge" id="wishlist-badge" hidden>0</span>
        </a>
        <a href="./compare.html" class="header__nav-link">Compare</a>
        <a href="./planner.html" class="header__nav-link">Plan a Trip</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container country-detail-page">
      <!-- Back Link -->
      <a href="./index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Explore
      </a>

      <!-- Country Detail -->
      <div class="country-detail" id="country-detail">
        <!-- Populated by JS -->
      </div>

      <!-- Loading State -->
      <div class="country-detail__loading" id="country-loading" hidden>
        <div class="spinner"></div>
        <p>Loading country details...</p>
      </div>

      <!-- Error State -->
      <p class="country-detail__error" id="country-error" hidden></p>

      <!-- Border Countries -->
      <section class="borders-section" id="borders-section" hidden>
        <h2 class="borders-section__title">Border Countries</h2>
        <div class="borders-section__grid" id="border-countries">
          <!-- Populated by JS -->
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__text">&copy; 2026 TripPlanner. Built for learning JavaScript.</p>
    </div>
  </footer>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

</body>
</html>
